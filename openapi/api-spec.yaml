openapi: 3.1.0
info:
  title: Ingatlan Kereső REST API
  description: >
    Típusbiztos OpenAPI 3.1 specifikáció az ingatlan-kereso Spring Boot 4.1.2 backend és React 19 SPA frontend között.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Helyi fejlesztői backend szerver
paths:
  /api/status:
    get:
      summary: Rendszerállapot lekérdezése
      operationId: getStatus
      responses:
        '200':
          description: A rendszer aktuális állapota és statisztikái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/portals:
    get:
      summary: Támogatott portálok listája
      operationId: getPortals
      responses:
        '200':
          description: A regisztrált ingatlanportálok és azok hirdetésszámai
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortalDescriptor'

  /api/cities:
    get:
      summary: Támogatott városok és előre definiált presetek
      operationId: getCities
      responses:
        '200':
          description: Előre definiált városok, preset csoportok és követett települések
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitiesResponse'

  /api/config:
    get:
      summary: Legutóbbi mentett keresési feltételek lekérdezése
      operationId: getLastCriteria
      responses:
        '200':
          description: Az elmentett vagy alapértelmezett keresési paraméterek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCriteria'
    post:
      summary: Keresési feltételek mentése
      operationId: saveLastCriteria
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCriteria'
      responses:
        '200':
          description: Sikeres mentés visszajelzése
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSuccessResponseDto'

  /api/presets:
    get:
      summary: Mentett keresési sablonok listázása
      operationId: getPresets
      responses:
        '200':
          description: A mentett keresési sablonok listája utolsó módosítás szerint csökkenő sorrendben
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchPreset'
    post:
      summary: Új keresési sablon mentése
      operationId: createPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchPresetInput'
      responses:
        '200':
          description: Sikeresen mentett keresési sablon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPreset'
        '400':
          description: Érvénytelen kérés vagy hiányzó sablonnév
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/presets/{id}:
    put:
      summary: Mentett keresési sablon módosítása vagy átnevezése
      operationId: updatePreset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: A módosítandó sablon azonosítója
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchPresetInput'
      responses:
        '200':
          description: Sikeresen frissített keresési sablon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPreset'
        '400':
          description: Érvénytelen kérés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: A megadott azonosítójú sablon nem található

    delete:
      summary: Mentett keresési sablon törlése
      operationId: deletePreset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: A törlendő sablon azonosítója
      responses:
        '200':
          description: Sikeres törlés visszajelzése
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSuccessResponseDto'
        '404':
          description: A megadott azonosítójú sablon nem található

  /api/presets/{id}/use:
    post:
      summary: Mentett keresési sablon használatának naplózása
      operationId: usePreset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: A használt sablon azonosítója
      responses:
        '200':
          description: A frissített lastUsedAt időbélyeggel ellátott sablon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPreset'
        '404':
          description: A megadott azonosítójú sablon nem található

  /api/history:
    get:
      summary: Korábban lementett hirdetések lekérése és szűrése
      operationId: getHistory
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Település szűrés
        - name: onlyDiscounted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Csak árcsökkentett ingatlanok
        - name: portal
          in: query
          required: false
          schema:
            type: string
          description: Portál szűrés
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
          description: Minimum ár (millió Ft)
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
          description: Maximum ár (millió Ft)
        - name: minArea
          in: query
          required: false
          schema:
            type: number
            minimum: 0
          description: Minimum alapterület (m²)
        - name: maxArea
          in: query
          required: false
          schema:
            type: number
            minimum: 0
          description: Maximum alapterület (m²)
        - name: minRooms
          in: query
          required: false
          schema:
            type: number
            minimum: 0
          description: Minimum szobaszám
        - name: maxRooms
          in: query
          required: false
          schema:
            type: number
            minimum: 0
          description: Maximum szobaszám
        - name: excludeViewed
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Megtekintett hirdetések kizárása
        - name: onlyNewConstruction
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Csak új építésű ingatlanok
        - name: sortBy
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ListingSortOption'
          description: Rendezési sorrend (pl. DISCOVERED_DESC, PRICE_ASC, PRICE_PER_M2_ASC)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Maximális találati szám lapozáshoz
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Találati eltolás lapozáshoz
      responses:
        '200':
          description: A szűrési feltételeknek megfelelő hirdetések listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngatlanItem'

  /api/properties/price-history:
    get:
      summary: Ingatlan ártörténet lekérdezése paraméter alapján
      operationId: getPriceHistoryByParam
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Ingatlan egyedi azonosítója
        - name: url
          in: query
          required: false
          schema:
            type: string
          description: Ingatlan közvetlen URL-je
      responses:
        '200':
          description: Az ingatlanhoz rögzített árváltozások listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistoryEntry'
        '400':
          description: Hiányzó id vagy url paraméter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/properties/{id}/price-history:
    get:
      summary: Ingatlan ártörténet lekérdezése útvonal azonosító alapján
      operationId: getPriceHistoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Ingatlan egyedi azonosítója
      responses:
        '200':
          description: Az ingatlanhoz rögzített árváltozások listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistoryEntry'
        '400':
          description: Hiányzó id paraméter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/properties/status-log:
    get:
      summary: Ingatlan állapotnapló lekérdezése paraméter alapján
      operationId: getStatusLogByParam
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Ingatlan egyedi azonosítója
        - name: url
          in: query
          required: false
          schema:
            type: string
          description: Ingatlan közvetlen URL-je
      responses:
        '200':
          description: Az ingatlan állapotváltozásainak naplója
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusLogEntry'
        '400':
          description: Hiányzó id vagy url paraméter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/properties/{id}/status-log:
    get:
      summary: Ingatlan állapotnapló lekérdezése útvonal azonosító alapján
      operationId: getStatusLogById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Ingatlan egyedi azonosítója
      responses:
        '200':
          description: Az ingatlan állapotváltozásainak naplója
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusLogEntry'
        '400':
          description: Hiányzó id paraméter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/properties/observations:
    get:
      summary: Ingatlan idősoros megfigyelések lekérdezése paraméter alapján
      operationId: getListingObservationsByParam
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Ingatlan egyedi azonosítója
        - name: url
          in: query
          required: false
          schema:
            type: string
          description: Ingatlan közvetlen URL-je
      responses:
        '200':
          description: Az ingatlan idősoros megfigyelési naplója
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingObservation'
        '400':
          description: Hiányzó id vagy url paraméter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/properties/{id}/observations:
    get:
      summary: Ingatlan idősoros megfigyelések lekérdezése útvonal azonosító alapján
      operationId: getListingObservationsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Ingatlan egyedi azonosítója
      responses:
        '200':
          description: Az ingatlan idősoros megfigyelési naplója
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingObservation'
        '400':
          description: Hiányzó id paraméter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/properties/hidden:
    get:
      summary: Elrejtett hirdetések lekérése
      operationId: getHiddenProperties
      responses:
        '200':
          description: Az adatbázisban elrejtett hirdetések listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngatlanItem'

  /api/properties/{id}/hide:
    post:
      summary: Ingatlan elrejtése / kukázása
      operationId: hideProperty
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Ingatlan azonosítója vagy URL-je
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyBatchActionRequest'
      responses:
        '200':
          description: Elrejtés eredménye
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyHideResponse'

  /api/properties/{id}/restore:
    post:
      summary: Elrejtett ingatlan visszaállítása
      operationId: restoreProperty
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Ingatlan azonosítója vagy URL-je
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyBatchActionRequest'
      responses:
        '200':
          description: Visszaállítás eredménye
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyHideResponse'

  /api/properties/discounted:
    get:
      summary: Árcsökkentett ingatlanok listája
      operationId: getDiscountedProperties
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Település szűrés
      responses:
        '200':
          description: Árcsökkenést elszenvedett ingatlanok listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngatlanItem'

  /api/search:
    post:
      summary: Élő párhuzamos keresés futtatása a portálokon
      operationId: executeSearch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCriteria'
      responses:
        '200':
          description: A keresési eredmények, piaci statisztikák és portál státuszok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponseDto'

  /api/open-urls:
    post:
      summary: URL-ek megnyitása és megtekintettként megjelölése
      operationId: openUrls
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Sikeres megnyitás és státusz frissítés eredménye
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenUrlsResponse'

  /api/items/viewed:
    post:
      summary: Egy adott hirdetés megtekintettként történő megjelölése
      operationId: markViewed
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkViewedRequest'
      responses:
        '200':
          description: Megtekintettség állapota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkViewedResponse'

  /api/history/clear:
    post:
      summary: Adatbázis / hirdetéstörténet törlése adott városra vagy globálisan
      operationId: clearHistory
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Opcionális városnév paraméter
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearHistoryRequest'
      responses:
        '200':
          description: Törlés eredménye
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearHistoryResponse'

components:
  schemas:
    SearchPreset:
      type: object
      required:
        - id
        - name
        - criteria
      properties:
        id:
          type: integer
          format: int64
          description: A keresési sablon egyedi azonosítója
          example: 1
        name:
          type: string
          description: A felhasználó által megadott profilnév
          example: Hajdúszoboszló Ház 70-120M
        criteria:
          $ref: '#/components/schemas/SearchCriteria'
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Létrehozás időpontja ISO-8601 formátumban
          example: '2026-11-06T17:30:00Z'
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Utolsó módosítás időpontja ISO-8601 formátumban
          example: '2026-11-06T17:30:00Z'
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Legutóbbi kiválasztás/használat időpontja ISO-8601 formátumban
          example: '2026-11-06T17:35:00Z'

    SearchPresetInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: A felhasználó által megadott profilnév
          example: Hajdúszoboszló Ház 70-120M
        criteria:
          $ref: '#/components/schemas/SearchCriteria'

    PropertyHideResponse:
      type: object
      required:
        - success
        - hidden
        - id
      properties:
        success:
          type: boolean
        hidden:
          type: boolean
        id:
          type: string

    PropertyHideResponseDto:
      $ref: '#/components/schemas/PropertyHideResponse'

    ActionSuccessResponseDto:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    SuccessResponse:
      $ref: '#/components/schemas/ActionSuccessResponseDto'

    ApiErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Időbélyeg ISO-8601 formátumban
        status:
          type: integer
          description: HTTP státuszkód
        error:
          type: string
          description: Hiba összefoglaló kódja vagy neve
        message:
          type: string
          description: Részletes hibaüzenet
        path:
          type: string
          description: A végpont elérési útja

    ErrorResponse:
      $ref: '#/components/schemas/ApiErrorResponse'

    OpenUrlsResponse:
      type: object
      required:
        - success
        - count
      properties:
        success:
          type: boolean
        count:
          type: integer

    OpenUrlsResponseDto:
      $ref: '#/components/schemas/OpenUrlsResponse'

    MarkViewedResponse:
      type: object
      required:
        - success
        - marked
        - url
      properties:
        success:
          type: boolean
        marked:
          type: boolean
        url:
          type: string

    MarkViewedResponseDto:
      $ref: '#/components/schemas/MarkViewedResponse'

    ClearHistoryResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        clearedCity:
          type: string
          nullable: true
        clearedAll:
          type: boolean
          nullable: true

    ClearHistoryResponseDto:
      $ref: '#/components/schemas/ClearHistoryResponse'

    PropertyBatchActionRequest:
      type: object
      properties:
        url:
          type: string
          nullable: true
          description: Ingatlan közvetlen URL-je
        urls:
          type: array
          items:
            type: string
          nullable: true
          description: Csoportosított hirdetéshez tartozó forrás URL-ek

    MarkViewedRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: A megtekintett hirdetés URL címe

    ClearHistoryRequest:
      type: object
      properties:
        city:
          type: string
          nullable: true
          description: Opcionális városnév a törléshez

    StatusResponse:
      type: object
      required:
        - status
        - port
        - totalInDb
        - trackedCities
      properties:
        status:
          type: string
          example: "UP"
        port:
          type: integer
          example: 8080
        totalInDb:
          type: integer
          format: int64
          example: 1240
        lastRunTime:
          type: string
          format: date-time
          nullable: true
        trackedCities:
          type: array
          items:
            $ref: '#/components/schemas/TrackedCityInfo'

    StatusResponseDto:
      $ref: '#/components/schemas/StatusResponse'

    PredefinedCity:
      type: object
      required:
        - key
        - name
        - county
        - description
      properties:
        key:
          type: string
        name:
          type: string
        county:
          type: string
        description:
          type: string

    TrackedCityInfo:
      type: object
      required:
        - key
        - name
        - count
      properties:
        key:
          type: string
        name:
          type: string
        count:
          type: integer
          format: int64

    CitiesResponse:
      type: object
      required:
        - predefined
        - presets
        - trackedCities
      properties:
        predefined:
          type: array
          items:
            $ref: '#/components/schemas/PredefinedCity'
        presets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        trackedCities:
          type: array
          items:
            $ref: '#/components/schemas/TrackedCityInfo'

    CitiesResponseDto:
      $ref: '#/components/schemas/CitiesResponse'

    PortalId:
      type: string
      enum:
        - dh
        - oc
        - jofogas
        - koltozzbe
        - ingatlanbazar
        - ingatlancom
        - unknown
      description: Támogatott ingatlanportál azonosító

    PortalDescriptor:
      type: object
      required:
        - id
        - name
        - brandColor
        - homepageUrl
        - enabledByDefault
        - supportedTypes
        - directListingSupported
        - savedListingCount
      properties:
        id:
          type: string
        name:
          type: string
        brandColor:
          type: string
        homepageUrl:
          type: string
          format: uri
        enabledByDefault:
          type: boolean
        supportedTypes:
          type: array
          items:
            $ref: '#/components/schemas/PropertyType'
        directListingSupported:
          type: boolean
        savedListingCount:
          type: integer
          format: int64

    PortalScrapeStatus:
      type: string
      enum:
        - SUCCESS
        - EMPTY
        - BOT_PROTECTED
        - SPA_FALLBACK
        - FAILED
      description: Portál lekérdezési státusza

    PortalStatusDto:
      type: object
      required:
        - portalId
        - portalName
        - status
        - foundCount
        - latencyMs
      properties:
        portalId:
          type: string
        portalName:
          type: string
        status:
          $ref: '#/components/schemas/PortalScrapeStatus'
        foundCount:
          type: integer
        latencyMs:
          type: integer
          format: int64
        fallbackUrl:
          type: string
          format: uri
          nullable: true
        message:
          type: string
          nullable: true
        httpStatusCode:
          type: integer
