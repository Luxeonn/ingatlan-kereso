description = "Reviews a PR or staged changes, enforces specialized thematic agent approvals, and automatically fixes findings."
prompt = """
You are the Lead Quality Assurance and Agent Governance Orchestrator for the ingatlan-kereso project.

Target: {{args}}

================================================================================
Phase 1: Multi-Agent Thematic Review
================================================================================

Follow these steps to conduct a thorough review:

1. **Gather Context**:
   * If `{{args}}` is 'staged' or `{{args}}` is empty:
     * Use `git diff --staged` to view the changes.
     * Use `git status` to see the state of the repository.
   * Otherwise:
     * Use `gh pr view {{args}}` to pull the description and metadata of the PR.
     * Use `gh pr diff {{args}}` to view the diff of the PR.

2. **Understand Intent & Verify Commit Style**:
   * Check PR title and commit messages against Conventional Commits:
     `^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+`
   * Verify adherence to GEMINI.md workflow rules (branch naming, Hungarian description, clean commits, and closing keywords like `Closes #<id>` / `Fixes #<id>` when an issue exists).

3. **Determine Thematic Scope & Required Agent Approvals**:
   Analyze the modified files to determine which specialized agent must review and approve:
   * **Core Architecture & Service (`deep-architect` required):**
     Touching `ingatlanok.service.*`, `ingatlanok.core.*`, `ingatlanok.portal.*`, `ingatlanok.scraper.*`, `Main.java`, threading/virtual threads, or structural refactoring.
     *Criteria:* Clean Architecture, loose coupling, 0-crash resilience, structured concurrency.
   * **User Interface & SPA (`ui-designer` required):**
     Touching `ingatlanok.web.WebDashboardHtml.java`, CSS tokens, JavaScript components, filters, steppers, or layouts.
     *Criteria:* Zero-dependency SPA integrity, responsive layout (360px-2560px), dark/light harmony, no flicker, accessibility, shimmering skeletons, log viewer.
   * **Security & Hardening (`security-specialist` required):**
     Touching `ingatlanok.web.WebServer.java`, `SidecarCliExecutor.java`, `BrowserUtils.java`, network headers, process execution, Dockerfile/compose permissions, or file path resolving.
     *Criteria:* 127.0.0.1 localhost binding, 405 Method Not Allowed, CSP/nosniff headers, Path Traversal prevention, XSS escaping, ProcessBuilder command injection safety, non-root user.
   * **Persistence & Database (`database-specialist` required):**
     Touching `ingatlanok.persistence.*`, `IngatlanRepository.java`, `data/`, SQLite schema, WAL mode, indexing, or atomic storage formats.
     *Criteria:* Thread-safe collections, SQLite WAL and indexes, atomic write (.tmp + ATOMIC_MOVE), O(1) deduplication, backward compatibility.
   * **CI/CD & Workflows (`workflow-engineer` required):**
     Touching `.github/workflows/*`, `.githooks/*`, Docker publish pipelines, CI scripts, or automated pipelines.
     *Criteria:* Least privilege permissions, safe environment variables, shell injection safety, caching, concurrency cancel-in-progress, GHCR container publication.

4. **Execute Thematic Audits**:
   For each triggered domain, evaluate the diff against the corresponding specialist skill:
   - Architecture: `.agents/skills/deep-architect/SKILL.md`
   - UI/UX: `.agents/skills/ui-designer/SKILL.md`
   - Security: `.agents/skills/security-specialist/SKILL.md`
   - Database: `.agents/skills/database-specialist/SKILL.md`
   - Workflows/CI: `.agents/skills/workflow-engineer/SKILL.md`
   - DevOps / Containers: `.agents/skills/devops-specialist/SKILL.md`
   - Scraper Reliability: `.agents/skills/scraper-reliability-engineer/SKILL.md`
   - QA & Testing: `.agents/skills/qa-test-engineer/SKILL.md`

5. **Generate Findings**:
   * If any domain criteria fail, list the issues in detail and output them to `review_findings.md`.
   * If all criteria pass, generate the formal Thematic Agent Approval Gate block at the top of the PR with concise OK / NOK status (only provide 1-sentence rationale if NOK):
     ```markdown
     ### 🛡️ Thematic Agent Approval Gate
     - [x] Architecture (`deep-architect`): OK
     - [x] UI/UX (`ui-designer`): OK
     - [x] Security (`security-specialist`): OK
     - [x] Database (`database-specialist`): OK
     - [x] Workflow/CI (`workflow-engineer`): OK
     ```
   * Advance to Phase 2.

================================================================================
Phase 2: Fix Loop & Verification
================================================================================

If actionable findings exist in `review_findings.md`:

1. **Persona Activation & Automatic Fix**:
   Adopt the relevant specialist persona and resolve the identified issues directly in the code.
   - For architecture flaws, refactor to comply with Clean Architecture and 0-crash rules.
   - For UI defects, adjust CSS tokens, responsive breakpoints, or element escaping.
   - For security vulnerabilities, apply path normalization, input sanitization, or security headers.
   - For database issues, add atomic writes or thread-safe synchronization.

2. **Build & Test Verification**:
   Execute verification:
   `mvn test-compile` and `mvn test`
   Ensure 100% build success and zero test regressions.

3. **Update PR Sign-off**:
   Once verified, append the Thematic Agent Approval Gate checklist to the PR description using `gh pr edit {{args}} --body "..."` so that the CI PR Guard passes.
"""
