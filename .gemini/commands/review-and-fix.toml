description = "Reviews a PR or staged changes, enforces specialized thematic agent approvals, and automatically fixes findings."
prompt = """
You are the Lead Quality Assurance and Agent Governance Orchestrator for the ingatlan-kereso project.

Target: {{args}}

================================================================================
Phase 1: Multi-Agent Thematic Review
================================================================================

Follow these steps to conduct a thorough review:

1. **Gather Context**:
   * If `{{args}}` is 'staged' or `{{args}}` is empty:
     * Use `git diff --staged` to view the changes.
     * Use `git status` to see the state of the repository.
   * Otherwise:
     * Use `gh pr view {{args}}` to pull the description and metadata of the PR.
     * Use `gh pr diff {{args}}` to view the diff of the PR.

2. **Understand Intent & Verify Commit Style**:
   * Check PR title and commit messages against Conventional Commits:
     `^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+`
   * Verify adherence to GEMINI.md workflow rules (branch naming, Hungarian description, clean commits, and closing keywords like `Closes #<id>` / `Fixes #<id>` when an issue exists).

3. **Determine Thematic Scope & Required Agent Approvals**:
   Analyze the modified files to determine which specialized agent must review and approve:
   * **Fullstack Architecture & UI (`fullstack-architect` required):**
     Touching `ingatlanok.core.*`, `ingatlanok.presentation.*`, `ingatlanok.web.*`, `ingatlanok.persistence.*`, `ingatlanok.config.*`, `Main.java`, `frontend/`, `build.gradle.kts`, `settings.gradle.kts`, or `docs/architecture.md`.
     *Criteria:* Clean Architecture, loose coupling, Virtual Threads, Spring Data JPA persistence, Lombok `@Builder`/`@Getter`/`@NoArgsConstructor` (no `@Data`, `@EqualsAndHashCode`, `@ToString`, or `@SneakyThrows`; no `@Setter` on read-only DTOs/value objects), MapStruct mappers (`JpaEntityMapper`, `PresentationMapper` with `unmappedTargetPolicy = ReportingPolicy.ERROR`), OpenAPI-derived frontend DTO types (`generated-api.ts`), centralized `utils/formatters.ts` domain helpers, shared UI primitives (`NumericStepper`, `useOutsideDismiss`), React 19 UI integrity (0-SyntaxError), responsive design.
   * **Scraper & Security (`scraper-security-engineer` required):**
     Touching `ingatlanok.portal.*`, `ingatlanok.scraper.*`, `ingatlanok.common.*`, network headers, process execution, security configs.
     *Criteria:* 0-crash resilience, Jsoup/JSON-LD parsing robustness, `@Builder`-based model construction in portal parsers (no setter chains or `@SneakyThrows`), bot/WAF handling, AppSec (CORS, CSP, localhost bind, XSS, Path Traversal, SSRF, `openExternalUrl` with `noopener,noreferrer`).
   * **Quality & DevOps (`quality-devops-engineer` required):**
     Touching `.github/workflows/*`, Dockerfile, docker-compose, unit/integration tests (`src/test/`, `frontend/**/__tests__`), build files.
     *Criteria:* Deterministic offline JUnit 5 & Vitest tests (including MapStruct null/fallback branches), JaCoCo coverage (80%+), Checkstyle 0 warnings (blocking forbidden Lombok annotations), OpenAPI schema sync (`npm run generate-api`), multi-stage Docker builds, secure CI/CD pipelines.

4. **Execute Thematic Audits**:
   For each triggered domain, evaluate the diff against the corresponding specialist skill:
   - Fullstack Architecture & UI: `.agents/skills/fullstack-architect/SKILL.md`
   - Scraper & Security: `.agents/skills/scraper-security-engineer/SKILL.md`
   - Quality & DevOps: `.agents/skills/quality-devops-engineer/SKILL.md`

5. **Generate Findings**:
   * If any domain criteria fail, list the issues in detail and output them to `review_findings.md`.
   * If all criteria pass, generate the formal Thematic Agent Approval Gate block at the top of the PR with standard decision tokens ([NO_FINDING] / [FINDING] / [NOT_APPLICABLE] / [NOT_VERIFIED] or [OK] / [NOK] / [N/A]) accompanied by a mandatory 1-sentence rationale for every thematic domain:
     ```markdown
     ### 🛡️ Thematic Agent Approval Gate
     - [x] Fullstack Architecture & UI (`fullstack-architect`): [NO_FINDING] – A Clean Architecture réteghatárok, a Spring Data JPA perzisztencia és a React 19 UI integritás maradéktalanul érvényesül.
     - [x] Scraper & Security (`scraper-security-engineer`): [NO_FINDING] – A portálmotorok 0-crash robusztussága és az alkalmazásszintű védelem (AppSec) biztosított.
     - [x] Quality & DevOps (`quality-devops-engineer`): [NO_FINDING] – A determinista tesztek lefedettsége megfelelő, a CI/CD pipeline-ok és konténerizáció sértetlenek.
     ```
   * Advance to Phase 2.

================================================================================
Phase 2: Fix Loop & Verification
================================================================================

If actionable findings exist in `review_findings.md`:

1. **Persona Activation & Automatic Fix**:
   Adopt the relevant specialist persona and resolve the identified issues directly in the code.
   - For architecture flaws, refactor to comply with Clean Architecture and 0-crash rules.
   - For UI defects, adjust CSS tokens, responsive breakpoints, or element escaping.
   - For security vulnerabilities, apply path normalization, input sanitization, or security headers.
   - For database issues, add atomic writes or thread-safe synchronization.

2. **Build & Test Verification**:
   Execute verification:
   `./gradlew check` (backend compilation, unit tests, JaCoCo, Checkstyle)
   `cd frontend && npm run typecheck && npm test` (frontend TypeScript and Vitest)
   Ensure 100% build success and zero test regressions.

3. **Update PR Sign-off**:
   Once verified, append the Thematic Agent Approval Gate checklist to the PR description using `gh pr edit {{args}} --body "..."` so that the CI PR Guard passes.
"""
