services:
  ingatlan-kereso:
    image: ${INGATLAN_IMAGE:-ghcr.io/luxeonn/ingatlan-kereso:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingatlan-kereso
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - NO_BROWSER=true
    volumes:
      - ingatlan_data:/app/data
      - ingatlan_logs:/app/logs
    restart: unless-stopped

volumes:
  ingatlan_data:
    name: ingatlan_data
  ingatlan_logs:
    name: ingatlan_logs
