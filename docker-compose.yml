services:
  ingatlan-kereso:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingatlan-kereso
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
