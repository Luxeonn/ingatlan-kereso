server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_HOST:127.0.0.1}

spring:
  application:
    name: ingatlan-kereso
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/ingatlanok_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
