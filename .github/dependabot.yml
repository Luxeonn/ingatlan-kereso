version: 2
updates:
  # =========================================================================
  # BACKEND: Java 21 / Maven függőségek (Spring, Jsoup, Gson, SQLite, JaCoCo stb.)
  # Egyetlen összevont (grouped) Backend PR-ba gyűjti az összes frissítést
  # =========================================================================
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # =========================================================================
  # FRONTEND: React 19 / TypeScript / Vite / Tailwind CSS SPA függőségek
  # Egyetlen összevont (grouped) Frontend PR-ba gyűjti az összes frissítést
  # =========================================================================
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # =========================================================================
  # CI / WORKFLOW: GitHub Actions verziófrissítések (.github/workflows)
  # Egyetlen összevont (grouped) Actions PR-ba gyűjti az összes frissítést
  # =========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "workflow"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # =========================================================================
  # TOOLS: Python segédeszközök és Scraper Sidecar modul (tools/requirements.txt)
  # Egyetlen összevont (grouped) Tools PR-ba gyűjti az összes frissítést
  # =========================================================================
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "tools"
    commit-message:
      prefix: "chore(deps)"
    groups:
      tools-dependencies:
        patterns:
          - "*"
