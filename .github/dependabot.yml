version: 2
updates:
  # Heti Maven függőségfrissítések figyelése egyetlen csoportosított PR-ban
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Heti Frontend SPA (npm) függőségfrissítések egyetlen csoportosított PR-ban
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Heti GitHub Actions verziófrissítések egyetlen csoportosított PR-ban (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Heti Python pip függőségfrissítések egyetlen csoportosított PR-ban (tools/requirements.txt - Sidecar modul)
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
