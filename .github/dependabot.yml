version: 2
updates:
  # =========================================================================
  # BACKEND: Java 21 / Gradle dependencies (Spring Boot, Jsoup, Gson, JaCoCo, etc.)
  # Groups all updates into a single consolidated Backend PR
  # =========================================================================
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # =========================================================================
  # FRONTEND: React 19 / TypeScript / Vite / Tailwind CSS SPA dependencies
  # Groups all updates into a single consolidated Frontend PR
  # =========================================================================
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # =========================================================================
  # CI / WORKFLOW: GitHub Actions version updates (.github/workflows)
  # Groups all updates into a single consolidated Actions PR
  # =========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "workflow"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # =========================================================================
  # TOOLS: Python utilities and the Scraper Sidecar module (tools/requirements.txt)
  # Groups all updates into a single consolidated Tools PR
  # =========================================================================
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "tools"
    commit-message:
      prefix: "chore(deps)"
    groups:
      tools-dependencies:
        patterns:
          - "*"
