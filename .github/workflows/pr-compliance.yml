name: PR Compliance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-compliance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compliance:
    name: PR Compliance & Agent Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Run compliance test suite
        run: node --test scripts/test-verify-pr-compliance.mjs

      - name: Verify PR description & Review-Risk Matrix
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node scripts/verify-pr-compliance.mjs \
            --body "$PR_BODY" \
            --diff-base "origin/$BASE_REF" \
            -v

      - name: Validate skills & governance rules
        run: bash scripts/validate-skills.sh -v
