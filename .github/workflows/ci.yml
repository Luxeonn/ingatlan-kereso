name: CI Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:
    inputs:
      run_all:
        description: Run all component suites regardless of changed paths
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.result.outputs.frontend }}
      backend: ${{ steps.result.outputs.backend }}
      openapi: ${{ steps.result.outputs.openapi }}
      container: ${{ steps.result.outputs.container }}
    steps:
      - name: Checkout repository
        if: inputs.run_all != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changed components
        if: inputs.run_all != true
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'openapi/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/**'
            backend:
              - 'src/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'config/**'
              - '.github/**'
              - 'scripts/**'
              - 'tools/**'
              - '.agents/**'
              - 'Dockerfile*'
              - 'docker-compose.yml'
              - 'GEMINI.md'
              - 'gemini.md'
            openapi:
              - 'openapi/**'
              - 'src/main/java/ingatlanok/web/**'
              - 'src/main/java/ingatlanok/dto/**'
              - 'src/main/java/ingatlanok/model/**'
              - 'src/main/java/ingatlanok/presentation/**'
              - 'frontend/src/types/generated-api.ts'
            container:
              - 'Dockerfile*'
              - 'docker-compose.yml'
              - 'build.gradle.kts'
            documentation:
              - '**/*.md'
              - '.gitignore'
              - 'LICENSE'
              - 'docs/**'

      - name: Select full or changed-component validation
        id: result
        env:
          RUN_ALL: ${{ inputs.run_all }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          CONTAINER_CHANGED: ${{ steps.filter.outputs.container }}
          DOCS_CHANGED: ${{ steps.filter.outputs.documentation }}
        run: |
          if [ "$RUN_ALL" = "true" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "openapi=true" >> "$GITHUB_OUTPUT"
            echo "container=true" >> "$GITHUB_OUTPUT"
          elif [ "$FRONTEND_CHANGED" = "true" ] || [ "$BACKEND_CHANGED" = "true" ]; then
            echo "frontend=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"
            echo "backend=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
            echo "openapi=$OPENAPI_CHANGED" >> "$GITHUB_OUTPUT"
            echo "container=$CONTAINER_CHANGED" >> "$GITHUB_OUTPUT"
          elif [ "$DOCS_CHANGED" = "true" ]; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "openapi=false" >> "$GITHUB_OUTPUT"
            echo "container=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unclassified changes detected; running all component suites."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "openapi=true" >> "$GITHUB_OUTPUT"
            echo "container=true" >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi-drift:
    name: OpenAPI contract drift check
    needs: detect
    if: needs.detect.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify API typegen freshness
        working-directory: frontend
        run: |
          npm ci
          npm run generate-api
          git diff --exit-code src/types/generated-api.ts || (echo "ERROR: generated-api.ts is outdated. Run 'npm run generate-api' in frontend!" && exit 1)

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, typecheck, test and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          dependency-graph: disabled
          add-job-summary: never

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Validate repository skills
        run: bash scripts/validate-skills.sh -v

      - name: Check and package backend
        run: ./gradlew check bootJar --build-cache

      - name: Headless REST API smoke test
        run: bash .github/scripts/run-smoke-test.sh

      - name: Calculate JaCoCo coverage
        if: always()
        run: bash .github/scripts/calculate-jacoco.sh

  trivy:
    name: Container scan (Trivy)
    needs: detect
    if: needs.detect.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build backend container image
        run: docker build -t ingatlan-backend:scan -f Dockerfile .

      - name: Run Trivy vulnerability scanner on container image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          image-ref: 'ingatlan-backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  gate:
    name: CI Build
    needs: [detect, gitleaks, openapi-drift, frontend, backend, trivy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required job results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          OPENAPI_RESULT: ${{ needs.openapi-drift.result }}
          OPENAPI_REQUIRED: ${{ needs.detect.outputs.openapi }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_REQUIRED: ${{ needs.detect.outputs.frontend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_REQUIRED: ${{ needs.detect.outputs.backend }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          TRIVY_REQUIRED: ${{ needs.detect.outputs.container }}
        run: |
          failed=0

          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Change detection did not succeed: $DETECT_RESULT"
            failed=1
          fi

          if [ "$GITLEAKS_RESULT" != "success" ]; then
            echo "Gitleaks secret scan did not succeed: $GITLEAKS_RESULT"
            failed=1
          fi

          if [ "$OPENAPI_REQUIRED" = "true" ] && [ "$OPENAPI_RESULT" != "success" ]; then
            echo "OpenAPI drift check was required but finished with: $OPENAPI_RESULT"
            failed=1
          elif [ "$OPENAPI_REQUIRED" != "true" ] && [ "$OPENAPI_RESULT" != "skipped" ]; then
            echo "OpenAPI drift check was not expected to run but finished with: $OPENAPI_RESULT"
            failed=1
          fi

          if [ "$FRONTEND_REQUIRED" = "true" ] && [ "$FRONTEND_RESULT" != "success" ]; then
            echo "Frontend was required but finished with: $FRONTEND_RESULT"
            failed=1
          elif [ "$FRONTEND_REQUIRED" != "true" ] && [ "$FRONTEND_RESULT" != "skipped" ]; then
            echo "Frontend was not expected to run but finished with: $FRONTEND_RESULT"
            failed=1
          fi

          if [ "$BACKEND_REQUIRED" = "true" ] && [ "$BACKEND_RESULT" != "success" ]; then
            echo "Backend was required but finished with: $BACKEND_RESULT"
            failed=1
          elif [ "$BACKEND_REQUIRED" != "true" ] && [ "$BACKEND_RESULT" != "skipped" ]; then
            echo "Backend was not expected to run but finished with: $BACKEND_RESULT"
            failed=1
          fi

          if [ "$TRIVY_REQUIRED" = "true" ] && [ "$TRIVY_RESULT" != "success" ]; then
            echo "Trivy container scan was required but finished with: $TRIVY_RESULT"
            failed=1
          elif [ "$TRIVY_REQUIRED" != "true" ] && [ "$TRIVY_RESULT" != "skipped" ]; then
            echo "Trivy container scan was not expected to run but finished with: $TRIVY_RESULT"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
