name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Path Filter (Detect Changed Components)
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'src/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'config/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22 (JavaScript Validator Engine)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install, Lint and Test Frontend SPA (React 19, TypeScript, Vitest, ESLint)
        run: |
          echo "=== ⚛️ Frontend SPA Quality Gates Indítása ==="
          cd frontend
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          echo "✅ Frontend SPA sikeresen lintelve, tesztelve és lefordítva."

      - name: Install Playwright Browsers (Chromium)
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E UI Action & Endpoint Smoke Tests (Vite Preview)
        run: |
          echo "=== 🎭 Playwright E2E UI Action & Smoke Tesztek Futtatása (Vite Preview) ==="
          cd frontend
          npm run test:e2e
          echo "✅ Minden UI gomb, beviteli mező, fül, szűrő és hálózati akció hibátlanul lefutott."

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-frontend
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Built SPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Compile, Lint (Checkstyle), GraalVM AOT and Test with Gradle & JaCoCo
        run: ./gradlew check bootJar --no-daemon

      - name: Headless REST API Runtime Smoke Test
        run: |
          echo "=== 🚀 Headless REST API Runtime Smoke Teszt Indítása (Spring Boot 4.1.0) ==="
          SERVER_PORT=8099 SERVER_HOST=127.0.0.1 NO_BROWSER=true java -jar build/libs/ingatlan-1.0.0.jar &
          APP_PID=$!
          echo "Szerver elindítva a háttérben PID: $APP_PID"

          # Várakozás a szerver felszállására (max 15 másodperc)
          READY=0
          for i in {1..15}; do
            if curl -s -f http://127.0.0.1:8099/api/status > /dev/null 2>&1; then
              READY=1
              echo "✅ A headless Spring Boot REST API sikeresen elindult a 8099-es porton ($i. másodpercben)."
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "::error::A headless REST API nem indult el 15 másodpercen belül!"
            kill -9 $APP_PID 2>/dev/null || true
            exit 1
          fi

          echo "=== 🔍 Végpontok és REST API Szerződés-ellenőrzése ==="
          # 1. REST API Status és Actuator Hiány ellenőrzés
          curl -s -f http://127.0.0.1:8099/api/status | grep -q '"status":"UP"' || { echo "::error::REST API /api/status nem UP!"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          echo "✅ REST API /api/status sikeresen ellenőrizve."
          ACTUATOR_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8099/actuator/health)
          if [ "$ACTUATOR_CODE" != "404" ]; then
            echo "::error::Actuator endpoint nem 404-gyel tért vissza (kód: $ACTUATOR_CODE)!"
            kill -9 $APP_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ Actuator health hiánya (404 Not Found) sikeresen ellenőrizve."

          # 2. CORS Preflight ellenőrzés
          curl -s -I -X OPTIONS http://127.0.0.1:8099/api/search | grep -qi "Access-Control-Allow-Origin" || { echo "::error::CORS preflight nem adott Access-Control-Allow-Origin fejlécet"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          echo "✅ CORS Preflight megfelelően működik."

          # 3. Alapvető REST API végpontok szerződés-ellenőrzése
          echo "REST API végpontok ellenőrzése..."
          curl -s -f http://127.0.0.1:8099/api/config | grep -q "cities" || { echo "::error::/api/config nem adott érvényes választ"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          curl -s -f http://127.0.0.1:8099/api/portals | grep -q "id" || { echo "::error::/api/portals nem adott érvényes választ"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          curl -s -f http://127.0.0.1:8099/api/cities | grep -q "Budapest" || { echo "::error::/api/cities nem adott érvényes választ"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          curl -s -f http://127.0.0.1:8099/api/status | grep -q "UP" || { echo "::error::/api/status nem adott érvényes választ"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }

          # 4. Headless tisztaság ellenőrzése: nincs beágyazott SPA fallback router, ismeretlen útvonal 404
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8099/dashboard)
          if [ "$HTTP_CODE" -ne 404 ]; then
            echo "::error::Headless REST API nem 404-et adott ismeretlen útvonalra: $HTTP_CODE"
            kill -9 $APP_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ Headless végpont-izoláció (404 Not Found a nem létező SPA útvonalakra) ellenőrizve."

          # Szerver rendezett leállítása
          kill -15 $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          echo "✅ Headless Smoke Teszt sikeresen befejeződött."

      - name: Report Build Summary & Quality Gates
        if: always()
        run: |
          echo "### 🚀 Backend Build, Determinisztikus Tesztek és Minőségi Kapuk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Minőségi Kapu / Terület | Állapot | Részletek |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java Környezet** | ✅ Aktív | Java 21 LTS (Eclipse Temurin) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Kódminőség (Checkstyle)** | ${{ job.status == 'success' && '✅ 0 Hiba' || '❌ Szabálysértés' }} | Checkstyle ellenőrzés megfelelt |" >> $GITHUB_STEP_SUMMARY

          if [ -f target/site/jacoco/jacoco.csv ]; then
            LINE_MISSED=$(awk -F',' 'NR>1 {sum+=$8} END {print sum}' target/site/jacoco/jacoco.csv)
            LINE_COVERED=$(awk -F',' 'NR>1 {sum+=$9} END {print sum}' target/site/jacoco/jacoco.csv)
            TOTAL_LINES=$((LINE_MISSED + LINE_COVERED))
            if [ "$TOTAL_LINES" -gt 0 ]; then
              COVERAGE_PCT=$(awk "BEGIN {printf \"%.2f\", ($LINE_COVERED / $TOTAL_LINES) * 100}")
              echo "| **Kódlefedettség (JaCoCo)** | ✅ ${COVERAGE_PCT}% | Cél: 80%+ ($LINE_COVERED / $TOTAL_LINES lefedett kódsor) |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "| **Headless REST API Integritás** | ${{ job.status == 'success' && '🛡️ Garantált' || '⚠️ Hibás' }} | Zero-SyntaxError & REST szerződések validálva |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref / Ág:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
