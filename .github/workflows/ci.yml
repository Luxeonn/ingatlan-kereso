name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/pull_request_template.md'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/pull_request_template.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Path Filter (Detect Changed Components)
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'src/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'config/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lint_outcome: ${{ steps.frontend-build.outcome }}
      e2e_outcome: ${{ steps.playwright-e2e.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22 (JavaScript Validator Engine)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install, Lint and Test Frontend SPA (React 19, TypeScript, Vitest, ESLint)
        id: frontend-build
        run: |
          echo "=== ⚛️ Frontend SPA Quality Gates Indítása ==="
          cd frontend
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          echo "✅ Frontend SPA sikeresen lintelve, tesztelve és lefordítva."

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers and Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          cd frontend
          npx playwright install-deps chromium

      - name: Run Playwright E2E UI Action & Endpoint Smoke Tests (Vite Preview)
        id: playwright-e2e
        run: |
          echo "=== 🎭 Playwright E2E UI Action & Smoke Tesztek Futtatása (Vite Preview) ==="
          cd frontend
          npm run test:e2e
          echo "✅ Minden UI gomb, beviteli mező, fül, szűrő és hálózati akció hibátlanul lefutott."

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-frontend
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Built SPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_outcome: ${{ steps.gradle-build.outcome }}
      smoke_outcome: ${{ steps.smoke-test.outcome }}
      coverage_pct: ${{ steps.jacoco.outputs.coverage_pct }}
      coverage_lines: ${{ steps.jacoco.outputs.coverage_lines }}
      coverage_status: ${{ steps.jacoco.outputs.coverage_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle with Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Compile, Lint (Checkstyle), GraalVM AOT and Test with Gradle & JaCoCo
        id: gradle-build
        run: ./gradlew check processAot bootJar --build-cache

      - name: Headless REST API Runtime Smoke Test
        id: smoke-test
        run: bash .github/scripts/run-smoke-test.sh

      - name: Calculate JaCoCo Code Coverage
        id: jacoco
        if: always()
        run: bash .github/scripts/calculate-jacoco.sh

  summary:
    name: Summary
    needs: [detect, frontend, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Unified CI/CD Pipeline Summary
        run: |
          echo "### 📊 Ingatlan Kereső — CI/CD Minőségi Kapuk Összegzése" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Terület | Minőségi Kapu | Állapot | Részletek |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          # Frontend kiértékelés
          FE_RESULT="${{ needs.frontend.result }}"
          FE_LINT="${{ needs.frontend.outputs.lint_outcome }}"
          FE_E2E="${{ needs.frontend.outputs.e2e_outcome }}"

          if [ "$FE_RESULT" = "success" ]; then
            echo "| **Frontend** | ⚛️ ESLint & TypeScript | ✅ Sikeres | React 19 típusellenőrzés & linter megfelelt |" >> $GITHUB_STEP_SUMMARY
            echo "| **Frontend** | 🧪 Vitest Egységtesztek | ✅ Sikeres | Komponens és állapotkezelő tesztek lefutottak |" >> $GITHUB_STEP_SUMMARY
            echo "| **Frontend** | 🎭 Playwright E2E UI | ✅ Sikeres | Chromium böngésző UI akciók validálva |" >> $GITHUB_STEP_SUMMARY
          elif [ "$FE_RESULT" = "skipped" ]; then
            echo "| **Frontend** | ⚛️ ESLint & TypeScript | ⚪ Átugorva | Frontend forrás nem módosult |" >> $GITHUB_STEP_SUMMARY
            echo "| **Frontend** | 🧪 Vitest Egységtesztek | ⚪ Átugorva | Frontend forrás nem módosult |" >> $GITHUB_STEP_SUMMARY
            echo "| **Frontend** | 🎭 Playwright E2E UI | ⚪ Átugorva | Frontend forrás nem módosult |" >> $GITHUB_STEP_SUMMARY
          else
            [ "$FE_LINT" = "failure" ] && FE_LINT_STATUS="❌ Sikertelen" || FE_LINT_STATUS="⚠️ Hiba"
            [ "$FE_E2E" = "failure" ] && FE_E2E_STATUS="❌ Sikertelen" || FE_E2E_STATUS="⚠️ Hiba"
            echo "| **Frontend** | ⚛️ ESLint & TypeScript | $FE_LINT_STATUS | Ellenőrizd a Frontend job naplóját |" >> $GITHUB_STEP_SUMMARY
            echo "| **Frontend** | 🧪 Vitest Egységtesztek | $FE_LINT_STATUS | Ellenőrizd a Frontend job naplóját |" >> $GITHUB_STEP_SUMMARY
            echo "| **Frontend** | 🎭 Playwright E2E UI | $FE_E2E_STATUS | Ellenőrizd a Playwright riportot |" >> $GITHUB_STEP_SUMMARY
          fi

          # Backend kiértékelés
          BE_RESULT="${{ needs.backend.result }}"
          BE_BUILD="${{ needs.backend.outputs.build_outcome }}"
          BE_SMOKE="${{ needs.backend.outputs.smoke_outcome }}"
          BE_COV="${{ needs.backend.outputs.coverage_pct }}"
          BE_COV_LINES="${{ needs.backend.outputs.coverage_lines }}"
          BE_COV_STATUS="${{ needs.backend.outputs.coverage_status }}"

          if [ "$BE_RESULT" = "success" ]; then
            echo "| **Backend** | ☕ Java & Gradle Build | ✅ Sikeres | Java 21 LTS + Spring Boot 4.1.0 + GraalVM AOT |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 🔍 Checkstyle Kódminőség | ✅ 0 Hiba | Checkstyle 10.21.4 ellenőrzés megfelelt |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 📈 Kódlefedettség (JaCoCo) | ✅ ${BE_COV:-N/A} | Cél: 80%+ (${BE_COV_LINES:-ismeretlen}) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 🛡️ Headless REST API Smoke | ✅ Garantált | Zero-SyntaxError & REST szerződések validálva |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BE_RESULT" = "skipped" ]; then
            echo "| **Backend** | ☕ Java & Gradle Build | ⚪ Átugorva | Backend forrás nem módosult |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 🔍 Checkstyle Kódminőség | ⚪ Átugorva | Backend forrás nem módosult |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 📈 Kódlefedettség (JaCoCo) | ⚪ Átugorva | Backend forrás nem módosult |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 🛡️ Headless REST API Smoke | ⚪ Átugorva | Backend forrás nem módosult |" >> $GITHUB_STEP_SUMMARY
          else
            [ "$BE_BUILD" = "failure" ] && BE_BUILD_STATUS="❌ Sikertelen" || BE_BUILD_STATUS="⚠️ Hiba"
            [ "$BE_SMOKE" = "failure" ] && BE_SMOKE_STATUS="❌ Sikertelen" || BE_SMOKE_STATUS="⚠️ Hiba"
            echo "| **Backend** | ☕ Java & Gradle Build | $BE_BUILD_STATUS | Fordítási, Checkstyle vagy teszthiba |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 🔍 Checkstyle Kódminőség | $BE_BUILD_STATUS | Checkstyle ellenőrzés állapota |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 📈 Kódlefedettség (JaCoCo) | ${BE_COV:-N/A} | ${BE_COV_LINES:-N/A} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend** | 🛡️ Headless REST API Smoke | $BE_SMOKE_STATUS | Headless REST API smoke teszt |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref / Ág:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Kiváltó Esemény:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY

          # Összesített hibavizsgálat
          FAILED=0
          if [ "${{ needs.detect.result }}" = "failure" ] || [ "$FE_RESULT" = "failure" ] || [ "$BE_RESULT" = "failure" ]; then
            FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Egy vagy több minőségi kapu nem teljesült!** Kérjük, javítsd a fenti hibákat a merge engedélyezéséhez." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **Minden minőségi kapu sikeresen teljesült!** A változtatások megfelelnek a szigorú minőségi követelményeknek." >> $GITHUB_STEP_SUMMARY
          fi
