name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Path Filter (Detect Changed Components)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'src/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'checkstyle.xml'
              - 'spotbugs-exclude.xml'
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22 (JavaScript Validator Engine)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install, Lint and Test Frontend SPA (React 19, TypeScript, Vitest, ESLint)
        run: |
          echo "=== ⚛️ Frontend SPA Quality Gates Indítása ==="
          cd frontend
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          echo "✅ Frontend SPA sikeresen lintelve, tesztelve és lefordítva."

      - name: Upload Built SPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Node.js 22 (Build Frontend Assets for Uber-JAR)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build & Embed Frontend SPA Assets
        run: |
          echo "=== ⚛️ Frontend SPA Építése a beágyazáshoz ==="
          cd frontend
          npm ci
          npm run build
          mkdir -p ../src/main/resources/static
          rm -rf ../src/main/resources/static/*
          cp -r dist/* ../src/main/resources/static/
          cd ..
          echo "✅ Frontend SPA assetek beágyazva a fat JAR-hoz."

      - name: Compile, Lint (Checkstyle & SpotBugs) and Test with Gradle & JaCoCo
        run: ./gradlew check shadowJar --no-daemon

      - name: Headless Application & Web UI Runtime Smoke Test
        run: |
          echo "=== 🚀 Web Dashboard és Szerver Runtime Smoke Teszt Indítása ==="
          SERVER_PORT=8099 SERVER_HOST=127.0.0.1 java -jar build/libs/ingatlan-1.0.jar &
          APP_PID=$!
          echo "Szerver elindítva a háttérben PID: $APP_PID"

          # Várakozás a szerver felszállására (max 15 másodperc)
          READY=0
          for i in {1..15}; do
            if curl -s -f http://127.0.0.1:8099/api/config > /dev/null 2>&1; then
              READY=1
              echo "✅ A beágyazott WebServer sikeresen elindult a 8099-es porton ($i. másodpercben)."
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "::error::A beágyazott WebServer nem indult el 15 másodpercen belül!"
            kill -9 $APP_PID 2>/dev/null || true
            exit 1
          fi

          echo "=== 🔍 Végpontok és Frontend Smoke Ellenőrzése ==="
          # 1. SPA index.html letöltése és root vizsgálata
          curl -s -f http://127.0.0.1:8099/ > /tmp/dashboard.html
          grep -q 'id="root"' /tmp/dashboard.html || { echo "::error::Hiányzik a root div az index.html-ből!"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          grep -q 'Ingatlan Kereső' /tmp/dashboard.html || { echo "::error::Hiányzik az alkalmazás címe az index.html-ből!"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          echo "✅ SPA index.html sikeresen kiszolgálva."

          # 2. Bundle JavaScript letöltése és Node.js V8 szintaxisvizsgálat
          JS_PATH=$(grep -oE '/assets/index-[a-zA-Z0-9_-]+\.js' /tmp/dashboard.html | head -n 1)
          if [ -n "$JS_PATH" ]; then
            echo "Élő JS bundle letöltése: $JS_PATH"
            curl -s -f "http://127.0.0.1:8099$JS_PATH" > /tmp/dashboard_live.js
            node --check /tmp/dashboard_live.js
            echo "✅ A valós szerver által kiszolgált SPA JavaScript kód hibátlan (node --check pass)!"
          else
            echo "::error::Nem található JS bundle hivatkozás az index.html-ben!"
            kill -9 $APP_PID 2>/dev/null || true
            exit 1
          fi

          # 3. CORS Preflight ellenőrzés
          curl -s -I -X OPTIONS http://127.0.0.1:8099/api/search | grep -qi "Access-Control-Allow-Origin" || { echo "::error::CORS preflight nem adott Access-Control-Allow-Origin fejlécet"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          echo "✅ CORS Preflight megfelelően működik."

          # 4. Alapvető REST API végpontok szerződés-ellenőrzése
          echo "REST API végpontok ellenőrzése..."
          curl -s -f http://127.0.0.1:8099/api/config | grep -q "cities" || { echo "::error::/api/config nem adott érvényes választ"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          curl -s -f http://127.0.0.1:8099/api/portals | grep -q "id" || { echo "::error::/api/portals nem adott érvényes választ"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }
          curl -s -f http://127.0.0.1:8099/api/cities | grep -q "Budapest" || { echo "::error::/api/cities nem adott érvényes választ"; kill -9 $APP_PID 2>/dev/null || true; exit 1; }

          echo "✅ Minden kritikus REST API végpont működőképes."

          # Szerver rendezett leállítása
          kill -15 $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          echo "✅ Headless Smoke Teszt sikeresen befejeződött."

      - name: Report Build Summary & Quality Gates
        if: always()
        run: |
          echo "### 🚀 Backend Build, Determinisztikus Tesztek és Minőségi Kapuk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Minőségi Kapu / Terület | Állapot | Részletek |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java Környezet** | ✅ Aktív | Java 21 LTS (Eclipse Temurin) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Kódminőség (Checkstyle)** | ${{ job.status == 'success' && '✅ 0 Hiba' || '❌ Szabálysértés' }} | Checkstyle ellenőrzés megfelelt |" >> $GITHUB_STEP_SUMMARY
          echo "| **Statikus Biztonság (SpotBugs)** | ${{ job.status == 'success' && '✅ 0 Hiba' || '❌ Szabálysértés' }} | SpotBugs 4.9.2 analízis megfelelt |" >> $GITHUB_STEP_SUMMARY

          if [ -f target/site/jacoco/jacoco.csv ]; then
            LINE_MISSED=$(awk -F',' 'NR>1 {sum+=$8} END {print sum}' target/site/jacoco/jacoco.csv)
            LINE_COVERED=$(awk -F',' 'NR>1 {sum+=$9} END {print sum}' target/site/jacoco/jacoco.csv)
            TOTAL_LINES=$((LINE_MISSED + LINE_COVERED))
            if [ "$TOTAL_LINES" -gt 0 ]; then
              COVERAGE_PCT=$(awk "BEGIN {printf \"%.2f\", ($LINE_COVERED / $TOTAL_LINES) * 100}")
              echo "| **Kódlefedettség (JaCoCo)** | ✅ ${COVERAGE_PCT}% | Cél: 80%+ ($LINE_COVERED / $TOTAL_LINES lefedett kódsor) |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "| **UI & Smoke Integritás** | ${{ job.status == 'success' && '🛡️ Garantált' || '⚠️ Hibás' }} | Zero-SyntaxError & REST szerződések validálva |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref / Ág:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
