name: PR Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to validate (optional, e.g. 182)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Pull Request Context
        id: pr-ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          RAW_PR_TITLE: ${{ github.event.pull_request.title }}
          RAW_PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          DELIM=$(openssl rand -hex 16)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "title<<$DELIM" >> "$GITHUB_OUTPUT"
            echo "$RAW_PR_TITLE" >> "$GITHUB_OUTPUT"
            echo "$DELIM" >> "$GITHUB_OUTPUT"
            echo "head_ref=$PR_HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "base_ref=$PR_BASE_REF" >> "$GITHUB_OUTPUT"
            echo "body<<$DELIM" >> "$GITHUB_OUTPUT"
            echo "$RAW_PR_BODY" >> "$GITHUB_OUTPUT"
            echo "$DELIM" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "Workflow triggered via $EVENT_NAME on ref $REF_NAME."
            PR_JSON=""
            if [ -n "$INPUT_PR_NUMBER" ]; then
              echo "Fetching PR details for PR #${INPUT_PR_NUMBER}..."
              PR_JSON=$(gh pr view "$INPUT_PR_NUMBER" --json title,headRefName,baseRefName,body,number 2>/dev/null || true)
            else
              echo "Searching for open PR associated with branch '${REF_NAME}'..."
              PR_JSON=$(gh pr view "${REF_NAME}" --json title,headRefName,baseRefName,body,number 2>/dev/null || true)
            fi

            if [ -n "$PR_JSON" ]; then
              PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // ""')
              PR_HEAD=$(echo "$PR_JSON" | jq -r '.headRefName // ""')
              PR_BASE=$(echo "$PR_JSON" | jq -r '.baseRefName // ""')
              PR_NUM=$(echo "$PR_JSON" | jq -r '.number // ""')

              echo "title<<$DELIM" >> "$GITHUB_OUTPUT"
              echo "$PR_TITLE" >> "$GITHUB_OUTPUT"
              echo "$DELIM" >> "$GITHUB_OUTPUT"
              echo "head_ref=${PR_HEAD}" >> "$GITHUB_OUTPUT"
              echo "base_ref=${PR_BASE:-develop}" >> "$GITHUB_OUTPUT"
              echo "body<<$DELIM" >> "$GITHUB_OUTPUT"
              echo "$PR_JSON" | jq -r '.body // ""' >> "$GITHUB_OUTPUT"
              echo "$DELIM" >> "$GITHUB_OUTPUT"
              echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
              echo "is_pr=true" >> "$GITHUB_OUTPUT"
              echo "✅ Successfully fetched PR #${PR_NUM} adatokat: '$PR_TITLE' ($PR_HEAD -> $PR_BASE)"
            else
              COMMIT_MSG=$(git log -1 --pretty=%s)
              COMMIT_BODY=$(git log -1 --pretty=%b)
              echo "title<<$DELIM" >> "$GITHUB_OUTPUT"
              echo "$COMMIT_MSG" >> "$GITHUB_OUTPUT"
              echo "$DELIM" >> "$GITHUB_OUTPUT"
              echo "head_ref=${REF_NAME}" >> "$GITHUB_OUTPUT"
              echo "base_ref=develop" >> "$GITHUB_OUTPUT"
              echo "body<<$DELIM" >> "$GITHUB_OUTPUT"
              echo "$COMMIT_BODY" >> "$GITHUB_OUTPUT"
              echo "$DELIM" >> "$GITHUB_OUTPUT"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
              echo "ℹ️ No open PR is associated with this branch. Validating the latest commit message instead: '$COMMIT_MSG'"
            fi
          fi

      - name: Validate PR Title (Conventional Commits)
        env:
          TITLE: ${{ steps.pr-ctx.outputs.title }}
        run: |
          echo "PR title under validation: '$TITLE'"
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+"
          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::warning::PR title does not follow Conventional Commits. Suggested format: 'feat: description' or 'feat(module): description'."
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert. This is advisory and does not block PR creation or CI."
          else
            echo "✅ PR title follows Conventional Commits."
          fi

      - name: Validate Source Branch Name Convention
        env:
          BRANCH: ${{ steps.pr-ctx.outputs.head_ref }}
        run: |
          echo "Source branch under validation: '$BRANCH'"
          if [[ "$BRANCH" == "develop" || "$BRANCH" == "main" ]]; then
            echo "✅ Protected integration branch allowed: $BRANCH"
            exit 0
          fi

          if [[ "$BRANCH" =~ ^dependabot\/ ]]; then
            echo "✅ Dependabot automation branch allowed: $BRANCH"
            exit 0
          fi
          
          REGEX="^(feature|fix|hotfix|docs|refactor|test|chore|release)\/[a-zA-Z0-9._-]+$"
          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "::warning::Source branch '$BRANCH' does not follow the suggested prefix/name convention (e.g. feature/search-filter, fix/parser-timeout, docs/guide). This is advisory and does not block PR creation or CI."
          else
            echo "✅ Source branch follows the suggested naming convention."
          fi

      - name: Verify PR Description is not empty
        env:
          BODY: ${{ steps.pr-ctx.outputs.body }}
          IS_PR: ${{ steps.pr-ctx.outputs.is_pr }}
        run: |
          if [ "$IS_PR" != "true" ]; then
            echo "ℹ️ Manual branch run (no associated PR): skipping PR description checks."
            exit 0
          fi

          if [ -z "$BODY" ] || [ ${#BODY} -lt 15 ]; then
            echo "::warning::The pull request description is short or incomplete. Consider adding a more detailed summary of the changes."
          else
            echo "✅ PR description provided (${#BODY} karakter)."
          fi

          if echo "$BODY" | grep -qiE "(closes|fixes|resolves)[[:space:]]+#[0-9]+"; then
            LINKED_MATCH=$(echo "$BODY" | grep -oiE "(closes|fixes|resolves)[[:space:]]+#[0-9]+" | head -n 1)
            echo "🔗 Automatic issue-closing keyword detected: '$LINKED_MATCH' (will close the issue automatically when merged)."
          else
            echo "ℹ️ No automatic closing keyword ('Closes #<id>', 'Fixes #<id>') found in the description. If this PR resolves an issue, consider adding 'Closes #...'."
          fi

      - name: Verify Thematic Agent Approval Gate
        env:
          BODY: ${{ steps.pr-ctx.outputs.body }}
          BASE_REF: ${{ steps.pr-ctx.outputs.base_ref }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ steps.pr-ctx.outputs.head_ref }}
          IS_PR: ${{ steps.pr-ctx.outputs.is_pr }}
        run: bash .github/scripts/verify-pr-gate.sh

      - name: Report PR Compliance Summary
        if: always()
        env:
          HEAD_REF: ${{ steps.pr-ctx.outputs.head_ref }}
          BASE_REF: ${{ steps.pr-ctx.outputs.base_ref }}
          IS_PR: ${{ steps.pr-ctx.outputs.is_pr }}
          PR_NUM: ${{ steps.pr-ctx.outputs.pr_number }}
          STATUS_SUCCESS: ${{ job.status == 'success' }}
        run: |
          echo "### 🛡️ PR Review Guard Results" >> $GITHUB_STEP_SUMMARY
          echo "- **PR title convention:** Advisory warning only; non-standard titles do not fail this guard." >> $GITHUB_STEP_SUMMARY
          echo "- **Source branch naming:** Advisory warning only; non-standard branch names do not fail this guard." >> $GITHUB_STEP_SUMMARY
          echo "- **Thematic review notes:** Advisory only; missing or incomplete notes do not fail this guard." >> $GITHUB_STEP_SUMMARY
          echo "- **Required quality checks:** CI/build/lint/security/tests remain authoritative and must pass according to repository branch protection." >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${HEAD_REF}\` -> \`${BASE_REF}\`" >> $GITHUB_STEP_SUMMARY
          if [ "$IS_PR" = "true" ]; then
            echo "- **PR Number:** #${PR_NUM}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Mode:** Manual workflow run (workflow_dispatch)" >> $GITHUB_STEP_SUMMARY
          fi

  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/describe') ||
        startsWith(github.event.comment.body, '/improve')))

    steps:
      - name: Verify AI Credentials Availability
        id: credentials-check
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
        run: |
          if [ -n "$OPENAI_KEY" ] || [ -n "$ANTHROPIC_KEY" ] || [ -n "$QODO_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "✅ AI Reviewer credentials detected."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No AI Reviewer API key (OPENAI_KEY, ANTHROPIC_KEY, or QODO_API_KEY) found in secrets. Skipping automated review safely."
          fi

      - name: Execute Qodo PR-Agent
        if: steps.credentials-check.outputs.has_key == 'true'
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
