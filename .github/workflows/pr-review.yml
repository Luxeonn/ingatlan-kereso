name: PR Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to validate (optional, e.g. 182)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Pull Request Context
        id: pr-ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "title<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.pull_request.title }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "head_ref=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.pull_request.body }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "Workflow triggered via ${{ github.event_name }} on ref ${{ github.ref_name }}."
            PR_JSON=""
            if [ -n "$INPUT_PR_NUMBER" ]; then
              echo "Fetching PR details for PR #${INPUT_PR_NUMBER}..."
              PR_JSON=$(gh pr view "$INPUT_PR_NUMBER" --json title,headRefName,baseRefName,body,number 2>/dev/null || true)
            else
              echo "Searching for open PR associated with branch '${{ github.ref_name }}'..."
              PR_JSON=$(gh pr view "${{ github.ref_name }}" --json title,headRefName,baseRefName,body,number 2>/dev/null || true)
            fi

            if [ -n "$PR_JSON" ]; then
              PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // ""')
              PR_HEAD=$(echo "$PR_JSON" | jq -r '.headRefName // ""')
              PR_BASE=$(echo "$PR_JSON" | jq -r '.baseRefName // ""')
              PR_NUM=$(echo "$PR_JSON" | jq -r '.number // ""')

              echo "title<<EOF" >> "$GITHUB_OUTPUT"
              echo "$PR_TITLE" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              echo "head_ref=${PR_HEAD}" >> "$GITHUB_OUTPUT"
              echo "base_ref=${PR_BASE:-develop}" >> "$GITHUB_OUTPUT"
              echo "body<<EOF" >> "$GITHUB_OUTPUT"
              echo "$PR_JSON" | jq -r '.body // ""' >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
              echo "is_pr=true" >> "$GITHUB_OUTPUT"
              echo "✅ Sikerült lekérni a PR #${PR_NUM} adatokat: '$PR_TITLE' ($PR_HEAD -> $PR_BASE)"
            else
              COMMIT_MSG=$(git log -1 --pretty=%s)
              COMMIT_BODY=$(git log -1 --pretty=%b)
              echo "title<<EOF" >> "$GITHUB_OUTPUT"
              echo "$COMMIT_MSG" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              echo "head_ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              echo "base_ref=develop" >> "$GITHUB_OUTPUT"
              echo "body<<EOF" >> "$GITHUB_OUTPUT"
              echo "$COMMIT_BODY" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
              echo "ℹ️ Nincs nyitott PR ehhez az ághoz. Ágszintű ellenőrzés a legutóbbi commit üzenettel: '$COMMIT_MSG'"
            fi
          fi

      - name: Validate PR Title (Conventional Commits)
        env:
          TITLE: ${{ steps.pr-ctx.outputs.title }}
        run: |
          echo "Ellenőrzés alatt álló PR cím: '$TITLE'"
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+"
          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::error::A PR címe nem felel meg a Conventional Commits szabályzatnak! Helyes formátum: 'feat: leírás' vagy 'feat(modul): leírás'."
            echo "Megengedett típusok: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "✅ PR cím érvényes."

      - name: Validate Source Branch Name Convention
        env:
          BRANCH: ${{ steps.pr-ctx.outputs.head_ref }}
        run: |
          echo "Ellenőrzés alatt álló forráság: '$BRANCH'"
          if [[ "$BRANCH" == "develop" || "$BRANCH" == "main" ]]; then
            echo "✅ Rendszerág összefésülés engedélyezve: $BRANCH"
            exit 0
          fi

          if [[ "$BRANCH" =~ ^dependabot\/ ]]; then
            echo "✅ Dependabot automatikus ág engedélyezve: $BRANCH"
            exit 0
          fi
          
          REGEX="^(feature|fix|hotfix|docs|refactor|test|chore|release)\/[a-zA-Z0-9._-]+$"
          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "::error::A forráság neve ('$BRANCH') nem követi a megengedett sémát! Követelmény: prefix/név (pl. feature/uj-funkcio, fix/hiba, docs/leiras)."
            exit 1
          fi
          echo "✅ Forráság elnevezése megfelelő."

      - name: Verify PR Description is not empty
        env:
          BODY: ${{ steps.pr-ctx.outputs.body }}
          IS_PR: ${{ steps.pr-ctx.outputs.is_pr }}
        run: |
          if [ "$IS_PR" != "true" ]; then
            echo "ℹ️ Kézi ágfuttatás (nincs kapcsolt PR): PR leírás ellenőrzése kihagyva."
            exit 0
          fi

          if [ -z "$BODY" ] || [ ${#BODY} -lt 15 ]; then
            echo "::warning::A Pull Request leírása túl rövid vagy hiányos! Kérjük, adj meg részletes összefoglalót a változtatásokról."
          else
            echo "✅ PR leírás kitöltve (${#BODY} karakter)."
          fi

          if echo "$BODY" | grep -qiE "(closes|fixes|resolves)[[:space:]]+#[0-9]+"; then
            LINKED_MATCH=$(echo "$BODY" | grep -oiE "(closes|fixes|resolves)[[:space:]]+#[0-9]+" | head -n 1)
            echo "🔗 Kapcsolódó issue automatikus lezárása észlelve: '$LINKED_MATCH' (merge-kor automatikusan zárul)."
          else
            echo "ℹ️ Nincs automatikusan lezáró kulcsszó ('Closes #<id>', 'Fixes #<id>') a leírásban. Ha a PR issue-t old meg, add meg a 'Closes #...' kulcsszót!"
          fi

      - name: Verify Thematic Agent Approval Gate
        env:
          BODY: ${{ steps.pr-ctx.outputs.body }}
          BASE_REF: ${{ steps.pr-ctx.outputs.base_ref }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ steps.pr-ctx.outputs.head_ref }}
          IS_PR: ${{ steps.pr-ctx.outputs.is_pr }}
        run: |
          echo "=== 🛡️ Thematic Agent Approval Gate Ellenőrzése ==="

          if [ "$IS_PR" != "true" ]; then
            echo "ℹ️ Kézi ágfuttatás (nincs kapcsolt PR): Thematic Agent Approval Gate leírás-ellenőrzés kihagyva."
            exit 0
          fi

          if [[ "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "dependabot" || "$BRANCH" =~ ^dependabot\/ ]]; then
            echo "🤖 Dependabot automatikus függőségfrissítés észlelve ($BRANCH / $ACTOR)."
            echo "✅ Thematic Agent Approval Gate: Dependabot bot által nyitott frissítés automatikusan jóváhagyva."
            exit 0
          fi
          
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" || true)
          echo "Módosított fájlok:"
          echo "$CHANGED_FILES"
          echo "----------------------------------------"

          MISSING_APPROVALS=""

          # 1. Fullstack Architecture & UI (fullstack-architect)
          if echo "$CHANGED_FILES" | grep -qE "src/main/java/ingatlanok/(core|presentation|web|persistence|model)/|Main\.java|frontend/|WebDashboardHtml\.java|static/"; then
            echo "-> Érintett téma: Fullstack Architektúra, Perzisztencia vagy UI (fullstack-architect szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(fullstack-architect|Fullstack Architect)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - 🏛️ Fullstack Architect Agent (\`fullstack-architect\`): Rendszerarchitektúra, Spring Data JPA perzisztencia, React 19 UI vagy REST szerződés jóváhagyása szükséges."
            fi
          fi

          # 2. Scraper Motorok & Alkalmazásbiztonság (scraper-security-engineer)
          if echo "$CHANGED_FILES" | grep -qE "src/main/java/ingatlanok/(portal|scraper|common)/|SidecarCliExecutor\.java|BrowserUtils\.java|HttpFetcher\.java"; then
            echo "-> Érintett téma: Scraper Motorok és Alkalmazásbiztonság (scraper-security-engineer szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(scraper-security-engineer|Scraper & Security)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - 🛡️ Scraper & Security Specialist (\`scraper-security-engineer\`): Scraper megbízhatóság, WAF/bot védelem vagy AppSec hardening jóváhagyása szükséges."
            fi
          fi

          # 3. Minőségbiztosítás, Tesztelés & DevOps/CI (quality-devops-engineer)
          if echo "$CHANGED_FILES" | grep -qE "\.github/|Dockerfile|docker-compose|src/test/|frontend/.*test|pom\.xml|package\.json"; then
            echo "-> Érintett téma: Minőségbiztosítás, DevOps vagy CI/CD (quality-devops-engineer szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(quality-devops-engineer|Quality & DevOps)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - ⚙️ Quality & DevOps Specialist (\`quality-devops-engineer\`): Tesztlefedettség, determinista tesztek, Docker vagy CI/CD pipeline jóváhagyása szükséges."
            fi
          fi

          if [ -n "$MISSING_APPROVALS" ]; then
            echo "::error::Hiányzó Tematikus Agent Jóváhagyás(ok)! A PR nem engedélyezett a megfelelő szakértői ágens igazolása nélkül:${MISSING_APPROVALS}"
            echo ""
            echo "Kérjük, add hozzá a jóváhagyást a PR leírásának 'Thematic Agent Approval Gate' blokkjához!"
            exit 1
          fi

          echo "✅ Minden érintett szakterület rendelkezik a kijelölt Agent jóváhagyásával."

      - name: Report PR Compliance Summary
        if: always()
        run: |
          echo "### 🛡️ PR Review (Guard) Eredmények" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Cím & Branch Szabályzat:** ${{ job.status == 'success' && '✅ Megfelelt (Conventional Commits & Prefix)' || '❌ Nem felelt meg' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Thematic Agent Approval Gate:** ${{ job.status == 'success' && '✅ Jóváhagyva (1-mondatos szakmai indoklással)' || '❌ Hiányos vagy elutasítva' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Merge Követelmény:** 🟢 Szigorúan CSAK AKKOR mergelhető, ha a CI és a PR Review is 100%-ban zöld!" >> $GITHUB_STEP_SUMMARY
          echo "- **Ág:** \`${{ steps.pr-ctx.outputs.head_ref }}\` -> \`${{ steps.pr-ctx.outputs.base_ref }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pr-ctx.outputs.is_pr }}" = "true" ]; then
            echo "- **PR Szám:** #${{ steps.pr-ctx.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Mód:** Manuális ágfuttatás (workflow_dispatch)" >> $GITHUB_STEP_SUMMARY
          fi

  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/')) }}

    steps:
      - name: Verify AI Credentials Availability
        id: credentials-check
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
        run: |
          if [ -n "$OPENAI_KEY" ] || [ -n "$ANTHROPIC_KEY" ] || [ -n "$QODO_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "✅ AI Reviewer credentials detected."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No AI Reviewer API key (OPENAI_KEY, ANTHROPIC_KEY, or QODO_API_KEY) found in secrets. Skipping automated review safely."
          fi

      - name: Execute Qodo PR-Agent
        if: steps.credentials-check.outputs.has_key == 'true'
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
