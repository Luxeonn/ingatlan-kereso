name: Docker Build

on:
  push:
    branches:
      - develop

concurrency:
  group: images-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Require develop branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate selected branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "$BRANCH" != "develop" ]; then
            echo "Images can only be built from the develop branch."
            exit 1
          fi

  verify:
    name: Verify develop
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      run_all: true
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: Publish latest image (${{ matrix.component }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout verified develop commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Normalize image repository name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.repository }}-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
