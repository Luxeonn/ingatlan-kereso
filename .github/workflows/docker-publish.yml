name: Release

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      custom_tag_suffix:
        description: "Opcionális egyedi tag utótag (alapértelmezetten a branch neve)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: Dockerfile
            image: ${{ github.repository }}-backend
          - component: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            image: ${{ github.repository }}-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract project version from build.gradle.kts
        id: pom-version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n 1)
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "Extracted build.gradle.kts project version: ${VERSION:-1.0.0}"

      - name: Resolve Dynamic Docker Tag
        id: dynamic-tag
        run: |
          VERSION="${{ steps.pom-version.outputs.version }}"
          INPUT_SUFFIX="${{ inputs.custom_tag_suffix }}"
          RAW_SUFFIX="${INPUT_SUFFIX:-${{ github.ref_name }}}"
          SANITIZED_SUFFIX=$(echo "$RAW_SUFFIX" | sed -E 's/[^a-zA-Z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SANITIZED_SUFFIX" ]; then
            SANITIZED_SUFFIX="manual"
          fi
          DYNAMIC_TAG="${VERSION}-${SANITIZED_SUFFIX}"
          echo "suffix=${SANITIZED_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "tag=${DYNAMIC_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved dynamic Docker tag: ${DYNAMIC_TAG}"

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            # develop ágon push esetén: kizárólag latest (vagy kézi indításkor ha nincs egyedi suffix megadva)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' && (github.event_name == 'push' || inputs.custom_tag_suffix == '') }}

            # Git tag esetén (pl. 1.0.0):
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/0.') }}

            # main ágra érkező push: fix verziószám a build.gradle.kts-ből és commit SHA (v előtag nélkül)
            type=raw,value=${{ steps.pom-version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=sha,prefix=${{ steps.pom-version.outputs.version }}-,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

            # workflow_dispatch kézi indítás bármely ágra: dinamikus <version>-<branch> vagy <version>-<custom_tag_suffix>
            type=raw,value=${{ steps.dynamic-tag.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Generate Action Step Summary
        if: always() && steps.build-and-push.conclusion == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          COMPONENT: ${{ matrix.component }}
          IMAGE_NAME: ${{ matrix.image }}
          CUSTOM_SUFFIX: ${{ inputs.custom_tag_suffix }}
          DYNAMIC_TAG: ${{ steps.dynamic-tag.outputs.tag }}
        run: |
          echo "### 🐳 Docker Image Build & Publish Eredmények (${COMPONENT})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tulajdonság | Érték |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Komponens** | \`$COMPONENT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Regiszter** | \`ghcr.io\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Név** | \`${{ env.REGISTRY }}/${IMAGE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Esemény / Ág** | \`$EVENT_NAME\` / \`$REF_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "| **Dinamikus Tag** | \`$DYNAMIC_TAG\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$CUSTOM_SUFFIX" ]; then
              echo "| **Egyedi Utótag (Input)** | \`$CUSTOM_SUFFIX\` |" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "| **Indító felhasználó** | \`$ACTOR\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Digest** | \`$DIGEST\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### 🏷️ Generált és Publikált Címkék (Tags)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### 🚀 Gyorsindítás Docker Compose segítségével" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose pull" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose up -d" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
