name: Release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to build and publish
        required: true
        type: choice
        options:
          - develop
          - main
        default: develop
      publish_latest:
        description: Publish or update the latest tag (develop only)
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: Dockerfile
            image: ${{ github.repository }}-backend
          - component: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            image: ${{ github.repository }}-frontend

    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_branch }}

      - name: Extract project version from build.gradle.kts
        id: pom-version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n 1)
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "Extracted build.gradle.kts project version: ${VERSION:-1.0.0}"

      - name: Resolve Commit SHA
        id: resolve-sha
        run: |
          COMMIT_SHA="${GITHUB_SHA}"
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved workflow commit SHA: ${COMMIT_SHA} (short: ${SHORT_SHA})"

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            # The latest tag is opt-in and only available for develop.
            type=raw,value=latest,enable=${{ inputs.publish_latest && inputs.source_branch == 'develop' }}

            # Keep an immutable source-commit tag for every manual publication.
            type=raw,value=sha-${{ steps.resolve-sha.outputs.short_sha }}

            # Main publications also receive the configured project version tags.
            type=raw,value=${{ steps.pom-version.outputs.version }},enable=${{ inputs.source_branch == 'main' }}
            type=raw,value=${{ steps.pom-version.outputs.version }}-${{ steps.resolve-sha.outputs.short_sha }},enable=${{ inputs.source_branch == 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Generate Action Step Summary
        if: always() && steps.build-and-push.conclusion == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          REF_NAME: ${{ inputs.source_branch }}
          ACTOR: ${{ github.actor }}
          COMPONENT: ${{ matrix.component }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "### Docker Image Build & Publish Results (${COMPONENT})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Component** | \`${COMPONENT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Registry** | \`ghcr.io\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Name** | \`${REGISTRY}/${IMAGE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Source branch** | \`${REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | \`${ACTOR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Digest** | \`${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Published Tags" >> "$GITHUB_STEP_SUMMARY"
          echo ' \`\`\`text' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo ' \`\`\`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Quick Start with Docker Compose" >> "$GITHUB_STEP_SUMMARY"
          echo ' \`\`\`bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose pull" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose up -d" >> "$GITHUB_STEP_SUMMARY"
          echo ' \`\`\`' >> "$GITHUB_STEP_SUMMARY"
