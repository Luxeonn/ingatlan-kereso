name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish (${{ matrix.component }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: Dockerfile
            image: ${{ github.repository }}-backend
          - component: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            image: ${{ github.repository }}-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract project version from build.gradle.kts
        id: pom-version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n 1)
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "Extracted build.gradle.kts project version: ${VERSION:-1.0.0}"

      - name: Resolve Commit SHA
        id: resolve-sha
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved commit SHA: ${COMMIT_SHA} (short: ${SHORT_SHA})"

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            # develop ágon: latest tag
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'develop' }}

            # Git tag esetén (pl. 1.0.0):
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/0.') }}

            # main ág: fix verziószám a build.gradle.kts-ből és commit SHA (v előtag nélkül)
            type=raw,value=${{ steps.pom-version.outputs.version }},enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ steps.pom-version.outputs.version }}-${{ steps.resolve-sha.outputs.short_sha }},enable=${{ github.event.workflow_run.head_branch == 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Generate Action Step Summary
        if: always() && steps.build-and-push.conclusion == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          REF_NAME: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.actor }}
          COMPONENT: ${{ matrix.component }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "### 🐳 Docker Image Build & Publish Eredmények (${COMPONENT})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tulajdonság | Érték |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Komponens** | \`$COMPONENT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Regiszter** | \`ghcr.io\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Név** | \`${{ env.REGISTRY }}/${IMAGE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ág** | \`$REF_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Indító felhasználó** | \`$ACTOR\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Digest** | \`$DIGEST\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### 🏷️ Generált és Publikált Címkék (Tags)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### 🚀 Gyorsindítás Docker Compose segítségével" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose pull" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose up -d" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
