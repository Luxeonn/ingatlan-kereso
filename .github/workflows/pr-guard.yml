name: PR & Branch Protection Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-compliance:
    name: Validate PR Standards & Branch Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR Title (Conventional Commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Ellenőrzés alatt álló PR cím: '$TITLE'"
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+"
          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::error::A PR címe nem felel meg a Conventional Commits szabályzatnak! Helyes formátum: 'feat: leírás' vagy 'feat(modul): leírás'."
            echo "Megengedett típusok: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "✅ PR cím érvényes."

      - name: Validate Source Branch Name Convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Ellenőrzés alatt álló forráság: '$BRANCH'"
          # Ha a develop mergeli a maint vagy forditva release esetén, azt is engedjuk
          if [[ "$BRANCH" == "develop" || "$BRANCH" == "main" ]]; then
            echo "✅ Rendszerág összefésülés engedélyezve: $BRANCH"
            exit 0
          fi

          # Dependabot által automatikusan létrehozott ágak engedélyezése
          if [[ "$BRANCH" =~ ^dependabot\/ ]]; then
            echo "✅ Dependabot automatikus ág engedélyezve: $BRANCH"
            exit 0
          fi
          
          REGEX="^(feature|fix|hotfix|docs|refactor|test|chore|release)\/[a-zA-Z0-9._-]+$"
          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "::error::A forráság neve ('$BRANCH') nem követi a megengedett sémát! Követelmény: prefix/név (pl. feature/uj-funkcio, fix/hiba, docs/leiras)."
            exit 1
          fi
          echo "✅ Forráság elnevezése megfelelő."

      - name: Verify PR Description is not empty
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ] || [ ${#BODY} -lt 15 ]; then
            echo "::warning::A Pull Request leírása túl rövid vagy hiányos! Kérjük, adj meg részletes összefoglalót a változtatásokról."
          else
            echo "✅ PR leírás kitöltve (${#BODY} karakter)."
          fi

          # Kapcsolódó issue lezárási kulcsszó ellenőrzése és visszajelzés
          if echo "$BODY" | grep -qiE "(closes|fixes|resolves)[[:space:]]+#[0-9]+"; then
            LINKED_MATCH=$(echo "$BODY" | grep -oiE "(closes|fixes|resolves)[[:space:]]+#[0-9]+" | head -n 1)
            echo "🔗 Kapcsolódó issue automatikus lezárása észlelve: '$LINKED_MATCH' (merge-kor automatikusan zárul)."
          else
            echo "ℹ️ Nincs automatikusan lezáró kulcsszó ('Closes #<id>', 'Fixes #<id>') a leírásban. Ha a PR issue-t old meg, add meg a 'Closes #...' kulcsszót!"
          fi


      - name: Verify Thematic Agent Approval Gate
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "=== 🛡️ Thematic Agent Approval Gate Ellenőrzése ==="

          # Dependabot automatikus függőségfrissítések kezelése
          if [[ "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "dependabot" || "$BRANCH" =~ ^dependabot\/ ]]; then
            echo "🤖 Dependabot automatikus függőségfrissítés észlelve ($BRANCH / $ACTOR)."
            echo "✅ Thematic Agent Approval Gate: Dependabot bot által nyitott frissítés automatikusan jóváhagyva."
            exit 0
          fi
          
          # Módosított fájlok lekérése a célág és a PR között
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" || true)
          echo "Módosított fájlok:"
          echo "$CHANGED_FILES"
          echo "----------------------------------------"

          MISSING_APPROVALS=""

          # 1. Fullstack Architecture & UI (fullstack-architect)
          if echo "$CHANGED_FILES" | grep -qE "src/main/java/ingatlanok/(core|presentation|web|persistence|model)/|Main\.java|frontend/|WebDashboardHtml\.java|static/"; then
            echo "-> Érintett téma: Fullstack Architektúra, Perzisztencia vagy UI (fullstack-architect szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(fullstack-architect|Fullstack Architect)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - 🏛️ Fullstack Architect Agent (\`fullstack-architect\`): Rendszerarchitektúra, NoSQL perzisztencia, React 19 UI vagy REST szerződés jóváhagyása szükséges."
            fi
          fi

          # 2. Scraper Motorok & Alkalmazásbiztonság (scraper-security-engineer)
          if echo "$CHANGED_FILES" | grep -qE "src/main/java/ingatlanok/(portal|scraper|common)/|WebServer\.java|SidecarCliExecutor\.java|BrowserUtils\.java|HttpFetcher\.java"; then
            echo "-> Érintett téma: Scraper Motorok és Alkalmazásbiztonság (scraper-security-engineer szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(scraper-security-engineer|Scraper & Security)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - 🛡️ Scraper & Security Specialist (\`scraper-security-engineer\`): Scraper megbízhatóság, WAF/bot védelem vagy AppSec hardening jóváhagyása szükséges."
            fi
          fi

          # 3. Minőségbiztosítás, Tesztelés & DevOps/CI (quality-devops-engineer)
          if echo "$CHANGED_FILES" | grep -qE "\.github/|Dockerfile|docker-compose|src/test/|frontend/.*test|pom\.xml|package\.json"; then
            echo "-> Érintett téma: Minőségbiztosítás, DevOps vagy CI/CD (quality-devops-engineer szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(quality-devops-engineer|Quality & DevOps)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - ⚙️ Quality & DevOps Specialist (\`quality-devops-engineer\`): Tesztlefedettség, determinista tesztek, Docker vagy CI/CD pipeline jóváhagyása szükséges."
            fi
          fi

          if [ -n "$MISSING_APPROVALS" ]; then
            echo "::error::Hiányzó Tematikus Agent Jóváhagyás(ok)! A PR nem engedélyezett a megfelelő szakértői ágens igazolása nélkül:${MISSING_APPROVALS}"
            echo ""
            echo "Kérjük, add hozzá a jóváhagyást a PR leírásának 'Thematic Agent Approval Gate' blokkjához!"
            exit 1
          fi

          echo "✅ Minden érintett szakterület rendelkezik a kijelölt Agent jóváhagyásával."

      - name: Report PR Compliance Summary
        if: always()
        run: |
          echo "### 🛡️ PR & Branch Protection Guard Eredmények" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Cím & Branch Szabályzat:** ${{ job.status == 'success' && '✅ Megfelelt (Conventional Commits & Prefix)' || '❌ Nem felelt meg' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Thematic Agent Approval Gate:** ${{ job.status == 'success' && '✅ Jóváhagyva (1-mondatos szakmai indoklással)' || '❌ Hiányos vagy elutasítva' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Merge Követelmény:** 🟢 Szigorúan CSAK AKKOR mergelhető, ha a Java CI és a PR Guard is 100%-ban zöld!" >> $GITHUB_STEP_SUMMARY
          echo "- **Ág:** \`${{ github.head_ref }}\` -> \`${{ github.base_ref }}\`" >> $GITHUB_STEP_SUMMARY

