name: PR & Branch Protection Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-compliance:
    name: Validate PR Standards & Branch Conventions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR Title (Conventional Commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Ellenőrzés alatt álló PR cím: '$TITLE'"
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+"
          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::error::A PR címe nem felel meg a Conventional Commits szabályzatnak! Helyes formátum: 'feat: leírás' vagy 'feat(modul): leírás'."
            echo "Megengedett típusok: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "✅ PR cím érvényes."

      - name: Validate Source Branch Name Convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Ellenőrzés alatt álló forráság: '$BRANCH'"
          # Ha a develop mergeli a maint vagy forditva release esetén, azt is engedjuk
          if [[ "$BRANCH" == "develop" || "$BRANCH" == "main" ]]; then
            echo "✅ Rendszerág összefésülés engedélyezve: $BRANCH"
            exit 0
          fi

          # Dependabot által automatikusan létrehozott ágak engedélyezése
          if [[ "$BRANCH" =~ ^dependabot\/ ]]; then
            echo "✅ Dependabot automatikus ág engedélyezve: $BRANCH"
            exit 0
          fi
          
          REGEX="^(feature|fix|hotfix|docs|refactor|test|chore|release)\/[a-zA-Z0-9._-]+$"
          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "::error::A forráság neve ('$BRANCH') nem követi a megengedett sémát! Követelmény: prefix/név (pl. feature/uj-funkcio, fix/hiba, docs/leiras)."
            exit 1
          fi
          echo "✅ Forráság elnevezése megfelelő."

      - name: Verify PR Description is not empty
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ] || [ ${#BODY} -lt 15 ]; then
            echo "::warning::A Pull Request leírása túl rövid vagy hiányos! Kérjük, adj meg részletes összefoglalót a változtatásokról."
          else
            echo "✅ PR leírás kitöltve (${#BODY} karakter)."
          fi

      - name: Verify Thematic Agent Approval Gate
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "=== 🛡️ Thematic Agent Approval Gate Ellenőrzése ==="

          # Dependabot automatikus függőségfrissítések kezelése
          if [[ "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "dependabot" || "$BRANCH" =~ ^dependabot\/ ]]; then
            echo "🤖 Dependabot automatikus függőségfrissítés észlelve ($BRANCH / $ACTOR)."
            echo "✅ Thematic Agent Approval Gate: Dependabot bot által nyitott frissítés automatikusan jóváhagyva."
            exit 0
          fi
          
          # Módosított fájlok lekérése a célág és a PR között
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" || true)
          echo "Módosított fájlok:"
          echo "$CHANGED_FILES"
          echo "----------------------------------------"

          MISSING_APPROVALS=""

          # 1. Rendszerarchitektúra & Scraper réteg (deep-architect)
          if echo "$CHANGED_FILES" | grep -qE "src/main/java/ingatlanok/(service|scraper)/|Main\.java"; then
            echo "-> Érintett téma: Rendszerarchitektúra (deep-architect szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(Architecture|deep-architect)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - 🏛️ Deep Architect Agent (\`deep-architect\`): Architektúra, 0-crash és réteg-izoláció jóváhagyása szükséges."
            fi
          fi

          # 2. UI & Dashboard SPA (ui-designer)
          if echo "$CHANGED_FILES" | grep -qE "WebDashboardHtml\.java|static/|\.css|\.js"; then
            echo "-> Érintett téma: UI és Dashboard SPA (ui-designer szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(UI|ui-designer)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - 🎨 UI Designer Agent (\`ui-designer\`): Frontend design, reszponzivitás és komponensek jóváhagyása szükséges."
            fi
          fi

          # 3. Biztonság, Hálózat és Folyamatkezelés (security-specialist)
          if echo "$CHANGED_FILES" | grep -qE "WebServer\.java|SidecarCliExecutor\.java|BrowserUtils\.java|HttpFetcher\.java"; then
            echo "-> Érintett téma: Alkalmazásbiztonság és Hálózat (security-specialist szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(Security|security-specialist)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - 🛡️ Security Specialist Agent (\`security-specialist\`): AppSec, localhost kötés, XSS és command injection védelem jóváhagyása szükséges."
            fi
          fi

          # 4. Adatbázis és Perzisztencia (database-specialist)
          if echo "$CHANGED_FILES" | grep -qE "persistence/|IngatlanRepository\.java|data/"; then
            echo "-> Érintett téma: Adatbázis és Perzisztencia (database-specialist szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(Database|database-specialist)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - 💾 Database Specialist Agent (\`database-specialist\`): Szálbiztosság, atomi lemezre írás és duplikátumszűrés jóváhagyása szükséges."
            fi
          fi

          # 5. CI/CD és GitHub Actions (workflow-engineer)
          if echo "$CHANGED_FILES" | grep -qE "\.github/workflows/|\.githooks/"; then
            echo "-> Érintett téma: CI/CD és GitHub Actions (workflow-engineer szükséges)"
            if ! echo "$BODY" | grep -qiE "\[x\][[:space:]]*.*(Workflow|CI|workflow-engineer)"; then
              MISSING_APPROVALS="${MISSING_APPROVALS}\n  - ⚙️ Workflow Engineer Agent (\`workflow-engineer\`): GitHub Actions, CI/CD és automatizáció jóváhagyása szükséges."
            fi
          fi

          if [ -n "$MISSING_APPROVALS" ]; then
            echo "::error::Hiányzó Tematikus Agent Jóváhagyás(ok)! A PR nem engedélyezett a megfelelő szakértői ágens igazolása nélkül:${MISSING_APPROVALS}"
            echo ""
            echo "Futtasd a review-and-fix ágenst (.gemini/commands/review-and-fix.toml), és illeszd be a 'Thematic Agent Approval Gate' blokkot a PR leírásába!"
            exit 1
          fi

          echo "✅ Minden érintett szakterület rendelkezik a kijelölt Agent jóváhagyásával."
